<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 24" width="600" height="24">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B86BFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#B86BFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8FB1" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="11" width="240" height="2" rx="1" fill="url(#l)"/>
  <rect x="320" y="11" width="240" height="2" rx="1" fill="url(#r)"/>
  <circle cx="300" cy="12" r="4" fill="#FFD6A5">
    <animate attributeName="r" values="3;5.5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="282" cy="12" r="2" fill="#B86BFF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="318" cy="12" r="2" fill="#FF8FB1">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
